[package]
name = "atlas-desktop"
version = "0.1.0"
description = "Atlas for the desktop: the app in a window, and a node (VISION §16.3)."
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"

# How long since the person last touched the Mac, for the idle event (macOS only, for now).
[target.'cfg(target_os = "macos")'.dependencies]
user-idle = "0.6"
